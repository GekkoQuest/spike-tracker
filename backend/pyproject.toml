[project]
name = "spike-tracker-api"
version = "2.0.0"
description = "FastAPI backend for SpikeTracker"
requires-python = ">=3.14"
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "prometheus-client==0.25.0",
  "pydantic-settings==2.14.2",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.2.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["build"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "LOG",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "TC",
  "UP",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
warn_unreachable = true
