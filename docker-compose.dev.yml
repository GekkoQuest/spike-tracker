name: spike-tracker-dev

services:
  api:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://spiketracker:development@postgres:5432/spiketracker
      VLR_API_URL: https://vlr.orlandomm.net
      DEMO_MODE: ${DEMO_MODE:-false}
      TRACKING_ENABLED: "true"
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8000
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24.18-alpine
    working_dir: /app
    command: sh -c "npm install --global npm@12.0.1 && npm ci && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/package-lock.json:/app/package-lock.json:ro
      - ./frontend/eslint.config.js:/app/eslint.config.js:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: spiketracker
      POSTGRES_USER: spiketracker
      POSTGRES_PASSWORD: development
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spiketracker -d spiketracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend-node-modules:
  postgres-dev-data:
